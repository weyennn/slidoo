<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slidoo — Unggah Dokumen (Design Mockup v3)</title>
<style>
  @font-face {
    font-family: 'Gama Sans';
    src: url('../../assets/fonts/Gama-Sans-Regular.otf') format('opentype');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Gama Sans';
    src: url('../../assets/fonts/Gama-Sans-Bold.otf') format('opentype');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Gama Sans';
    src: url('../../assets/fonts/Gama-Sans-light.otf') format('opentype');
    font-weight: 300;
  }

  :root {
    --navy: #01416b;
    --navy-deep: #0e2841;
    --gold: #fdd402;
    --muted: #5a6b7d;
    --hairline: #dde6ef;
    --panel: #f2f6fa;
    --bg: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Gama Sans', Arial, sans-serif;
    background: var(--bg);
    color: var(--navy-deep);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── top bar ────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 40px;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark {
    width: 36px; height: 36px;
    background: var(--navy);
    border-radius: 9px;
    display: grid; place-items: center;
    color: var(--gold); font-weight: 700; font-size: 18px;
  }
  .brand-name { font-size: 19px; font-weight: 700; color: var(--navy); }
  .back {
    font-size: 14px; color: var(--muted); text-decoration: none;
    display: flex; align-items: center; gap: 6px;
  }
  .back:hover { color: var(--navy); }

  /* ── main split ─────────────────────────────────────── */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 7fr 5fr;
    gap: 40px;
    padding: 24px 40px 40px;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
    align-items: start;
  }

  /* left: the work area */
  .work h1 {
    font-size: 34px; font-weight: 700; letter-spacing: -0.6px; line-height: 1.15;
  }
  .work h1 em { font-style: normal; color: var(--navy); }
  .work .sub {
    margin-top: 10px; font-size: 15px; font-weight: 300; color: var(--muted);
  }

  .dropzone {
    margin-top: 26px;
    border: 2px dashed var(--hairline);
    border-radius: 18px;
    background: var(--panel);
    padding: 60px 32px;
    text-align: center;
    cursor: pointer;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--navy);
    background: #eaf1f8;
    box-shadow: 0 10px 30px rgba(1,65,107,.08);
  }
  .dz-icon {
    width: 60px; height: 60px;
    margin: 0 auto 16px;
    background: #fff;
    border: 1px solid var(--hairline);
    border-radius: 16px;
    display: grid; place-items: center;
  }
  .dz-icon svg { width: 28px; height: 28px; }
  .dz-title { font-size: 17px; font-weight: 700; }
  .dz-title span { color: var(--navy); text-decoration: underline; text-underline-offset: 3px; }
  .dz-sub { margin-top: 8px; font-size: 13px; font-weight: 300; color: var(--muted); }
  .dz-formats { margin-top: 16px; display: flex; justify-content: center; gap: 8px; }
  .chip {
    font-size: 11px; font-weight: 700; letter-spacing: .5px;
    padding: 4px 11px; border-radius: 999px;
    background: #fff; border: 1px solid var(--hairline); color: var(--muted);
  }

  .file-pill {
    display: none;
    align-items: center; gap: 12px;
    margin-top: 14px; padding: 12px 16px;
    border: 1px solid var(--hairline);
    border-radius: 12px; background: #fff;
  }
  .file-pill.show { display: flex; }
  .file-badge {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 9px; background: var(--navy); color: var(--gold);
    display: grid; place-items: center;
    font-size: 10px; font-weight: 700; letter-spacing: .5px;
  }
  .file-meta { flex: 1; min-width: 0; text-align: left; }
  .file-name { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-size { font-size: 12px; font-weight: 300; color: var(--muted); }
  .file-remove {
    border: none; background: none; cursor: pointer;
    color: var(--muted); font-size: 19px; line-height: 1; padding: 4px;
  }
  .file-remove:hover { color: #c0392b; }

  /* options row */
  .options {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 22px;
  }
  .field label {
    display: block; font-size: 12px; font-weight: 700;
    letter-spacing: .6px; text-transform: uppercase;
    color: var(--navy); margin-bottom: 7px;
  }
  .field select, .field input {
    width: 100%; font-family: inherit; font-size: 14px; color: var(--navy-deep);
    padding: 11px 13px;
    border: 1px solid var(--hairline); border-radius: 10px; background: #fff;
    outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .field select:focus, .field input:focus {
    border-color: var(--navy); box-shadow: 0 0 0 3px rgba(1,65,107,.1);
  }
  .field input::placeholder { color: #9fb0c0; }

  /* theme segmented control */
  .field.full { grid-column: 1 / -1; }
  .segmented {
    display: flex; gap: 6px;
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 12px; padding: 5px;
  }
  .seg {
    flex: 1; text-align: center;
    padding: 10px 8px;
    font-size: 13px; font-weight: 700;
    color: var(--muted);
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s, color .15s;
    border: none; font-family: inherit;
  }
  .seg:hover { color: var(--navy); }
  .seg.selected { background: #fff; color: var(--navy); box-shadow: 0 2px 8px rgba(1,65,107,.1); }
  .seg i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

  .cta {
    margin-top: 24px;
    width: 100%; border: none; font-family: inherit;
    font-size: 16px; font-weight: 700; padding: 15px;
    border-radius: 12px;
    background: var(--navy); color: #fff;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: background .15s, transform .1s;
  }
  .cta:hover { background: var(--navy-deep); }
  .cta:active { transform: scale(.99); }
  .cta:disabled { background: #c6d3df; cursor: not-allowed; }
  .cta .arrow { color: var(--gold); font-size: 18px; }

  /* ── right: output preview ──────────────────────────── */
  .preview {
    position: sticky; top: 24px;
  }
  .preview-label {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .preview-label::after { content: ''; flex: 1; height: 1px; background: var(--hairline); }

  .slide-stack { display: grid; gap: 14px; }
  .mini-slide {
    aspect-ratio: 16/9;
    border-radius: 10px;
    border: 1px solid var(--hairline);
    overflow: hidden;
    position: relative;
    background: #fff;
    transition: transform .2s, box-shadow .2s;
  }
  .mini-slide:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(1,65,107,.1); }
  .mini-slide .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 8%; }

  .ms-cover { background: linear-gradient(120deg, #fff 62%, var(--panel) 62%); }
  .ms-cover::before {
    content: ''; position: absolute; top: 12%; left: 8%;
    width: 26%; height: 10%; background: var(--navy); border-radius: 2px;
  }
  .ms-cover::after {
    content: ''; position: absolute; top: 34%; left: 8%;
    width: 60%; height: 14%; background: var(--navy-deep); border-radius: 2px; opacity: .9;
  }
  .ms-cover .goldline {
    position: absolute; top: 56%; left: 8%; width: 18%; height: 3%;
    background: var(--gold); border-radius: 2px;
  }
  .ms-cover .bar { background: var(--navy); }

  .ms-content::before {
    content: ''; position: absolute; top: 10%; left: 8%;
    width: 45%; height: 9%; background: var(--navy); border-radius: 2px;
  }
  .ms-content .bullets { position: absolute; top: 30%; left: 8%; right: 12%; display: grid; gap: 9%; height: 50%; }
  .ms-content .bullets i {
    display: block; height: 12%;
    background: var(--hairline); border-radius: 2px;
  }
  .ms-content .bullets i:nth-child(2) { width: 86%; }
  .ms-content .bullets i:nth-child(3) { width: 72%; }
  .ms-content .bar { background: var(--navy); }

  .ms-closing { background: var(--navy); }
  .ms-closing::before {
    content: ''; position: absolute; top: 40%; left: 30%; right: 30%;
    height: 14%; background: #fff; border-radius: 2px; opacity: .95;
  }
  .ms-closing .bar { background: var(--gold); }

  .preview-note {
    margin-top: 14px; font-size: 13px; font-weight: 300; color: var(--muted); line-height: 1.55;
  }
  .preview-note b { color: var(--navy); font-weight: 700; }

  /* ── responsive ─────────────────────────────────────── */
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; gap: 28px; padding: 16px 20px 32px; }
    .preview { position: static; }
    .slide-stack { grid-template-columns: repeat(3, 1fr); }
    .topbar { padding: 14px 20px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">S</div>
    <div class="brand-name">Slidoo</div>
  </div>
  <a class="back" href="#">← Kembali ke beranda</a>
</header>

<main>
  <section class="work">
    <h1>Dokumen masuk,<br /><em>deck keluar.</em></h1>
    <p class="sub">Unggah dokumenmu — Slidoo menyusun drafnya, kamu poles di studio.</p>

    <label class="dropzone" id="dropzone">
      <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.txt,.md" hidden />
      <div class="dz-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#01416b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="12" y1="18" x2="12" y2="11"/>
          <polyline points="9 14 12 11 15 14"/>
        </svg>
      </div>
      <div class="dz-title">Seret dokumen ke sini, atau <span>pilih file</span></div>
      <div class="dz-sub">Maksimal 20 MB</div>
      <div class="dz-formats">
        <span class="chip">PDF</span>
        <span class="chip">DOCX</span>
        <span class="chip">TXT</span>
        <span class="chip">MD</span>
      </div>
    </label>

    <div class="file-pill" id="filePill">
      <div class="file-badge" id="fileBadge">PDF</div>
      <div class="file-meta">
        <div class="file-name" id="fileName">proposal-sempro.pdf</div>
        <div class="file-size" id="fileSize">2,4 MB</div>
      </div>
      <button class="file-remove" id="fileRemove" title="Hapus file">&times;</button>
    </div>

    <div class="options">
      <div class="field">
        <label for="title">Judul</label>
        <input id="title" type="text" placeholder="Otomatis dari dokumen" />
      </div>
      <div class="field">
        <label for="pages">Halaman</label>
        <select id="pages">
          <option>Otomatis</option>
          <option>5</option>
          <option selected>8</option>
          <option>12</option>
          <option>15</option>
        </select>
      </div>
      <div class="field full">
        <label>Tema</label>
        <div class="segmented" id="themes">
          <button class="seg selected" data-theme="ugm-official"><i style="background:#01416b"></i>Official</button>
          <button class="seg" data-theme="ugm-midnight"><i style="background:linear-gradient(135deg,#01416b 50%,#fdd402 50%)"></i>Midnight</button>
          <button class="seg" data-theme="ugm-heritage"><i style="background:#c9a227"></i>Heritage</button>
        </div>
      </div>
    </div>

    <button class="cta" id="cta" disabled>
      Buat draf slide <span class="arrow">→</span>
    </button>
  </section>

  <aside class="preview">
    <div class="preview-label">Hasilnya seperti ini</div>
    <div class="slide-stack">
      <div class="mini-slide ms-cover"><i class="goldline"></i><div class="bar"></div></div>
      <div class="mini-slide ms-content"><div class="bullets"><i></i><i></i><i></i></div><div class="bar"></div></div>
      <div class="mini-slide ms-closing"><div class="bar"></div></div>
    </div>
    <p class="preview-note">Setiap deck dibuka di <b>studio</b> — edit judul, poin, dan tema per halaman sebelum dipublikasikan.</p>
  </aside>
</main>

<script>
  const dz = document.getElementById('dropzone');
  const input = document.getElementById('fileInput');
  const pill = document.getElementById('filePill');
  const cta = document.getElementById('cta');

  function fmtSize(b) {
    if (b > 1048576) return (b/1048576).toFixed(1).replace('.', ',') + ' MB';
    return Math.max(1, Math.round(b/1024)) + ' KB';
  }
  function setFile(f) {
    if (!f) { pill.classList.remove('show'); cta.disabled = true; return; }
    const ext = (f.name.split('.').pop() || '').toUpperCase();
    document.getElementById('fileBadge').textContent = ext;
    document.getElementById('fileName').textContent = f.name;
    document.getElementById('fileSize').textContent = fmtSize(f.size);
    pill.classList.add('show');
    cta.disabled = false;
  }
  input.addEventListener('change', () => setFile(input.files[0]));
  document.getElementById('fileRemove').addEventListener('click', (e) => {
    e.preventDefault(); input.value = ''; setFile(null);
  });
  ['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.add('dragover');
  }));
  ['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => {
    e.preventDefault(); dz.classList.remove('dragover');
  }));
  dz.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));

  document.getElementById('themes').addEventListener('click', e => {
    const seg = e.target.closest('.seg');
    if (!seg) return;
    document.querySelectorAll('.seg').forEach(s => s.classList.remove('selected'));
    seg.classList.add('selected');
  });
</script>
</body>
</html>
