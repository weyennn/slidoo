server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The bundle is built with base /slidoo/, so URLs arrive prefixed with
    # /slidoo/ while files on disk live at the web root. Strip the prefix
    # before looking files up; the SPA fallback keeps client-side routes
    # (e.g. /slidoo/s/<deck>) working.
    location /slidoo/ {
        rewrite ^/slidoo/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|woff2?|otf|ttf|ico|png|jpe?g|gif|svg|webp)$ {
        # Regex locations win over prefix locations in Nginx, so strip the
        # /slidoo/ prefix here as well before serving static files.
        rewrite ^/slidoo/?(.*)$ /$1 break;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
